<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Creator workflow</title>
  <desc id="desc">Three steps: create, verify and publish.</desc>
  <rect width="1200" height="560" rx="36" fill="#dcecff"/>
  <text x="600" y="68" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#123b66">CREATOR → VERIFY → PUBLISH</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(90 130)"><rect width="280" height="310" rx="28" fill="#fff"/><circle cx="140" cy="92" r="52" fill="#1769aa"/><text x="140" y="105" font-size="42" fill="#fff">▣</text><text x="140" y="190" font-size="30" font-weight="700" fill="#123b66">CREATE</text><text x="140" y="235" font-size="22" fill="#41556f">Scenes · text · media</text></g>
    <path d="M390 285h85" stroke="#5380aa" stroke-width="12"/><path d="m465 255 35 30-35 30" fill="none" stroke="#5380aa" stroke-width="12"/>
    <g transform="translate(460 130)"><rect width="280" height="310" rx="28" fill="#fff"/><circle cx="140" cy="92" r="52" fill="#00a88f"/><text x="140" y="108" font-size="48" fill="#fff">✓</text><text x="140" y="190" font-size="30" font-weight="700" fill="#123b66">VERIFY</text><text x="140" y="235" font-size="22" fill="#41556f">Preview · accessibility</text></g>
    <path d="M760 285h85" stroke="#5380aa" stroke-width="12"/><path d="m835 255 35 30-35 30" fill="none" stroke="#5380aa" stroke-width="12"/>
    <g transform="translate(830 130)"><rect width="280" height="310" rx="28" fill="#fff"/><circle cx="140" cy="92" r="52" fill="#ffb000"/><text x="140" y="108" font-size="48" fill="#183044">＋</text><text x="140" y="190" font-size="30" font-weight="700" fill="#123b66">PUBLISH</text><text x="140" y="235" font-size="22" fill="#41556f">Activity · block · ZIP</text></g>
  </g>
  <text x="600" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#41556f">One editable project, several Moodle uses</text>
</svg>
