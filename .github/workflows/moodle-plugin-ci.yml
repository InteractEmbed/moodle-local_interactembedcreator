name: Moodle Plugin CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Moodle ${{ matrix.moodle }} · PHP ${{ matrix.php }} · ${{ matrix.database }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {moodle: MOODLE_405_STABLE, php: '8.1', database: mariadb}
          - {moodle: MOODLE_405_STABLE, php: '8.3', database: pgsql}
          - {moodle: MOODLE_500_STABLE, php: '8.2', database: mariadb}
          - {moodle: MOODLE_501_STABLE, php: '8.4', database: mariadb}
          - {moodle: MOODLE_502_STABLE, php: '8.3', database: mariadb}
          - {moodle: MOODLE_502_STABLE, php: '8.4', database: pgsql}

    services:
      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:11' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=5
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Check out Creator
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pgsql, zip, gd, soap, intl
          ini-values: max_input_vars=5000, opcache.enable_cli=1, opcache.jit=disable
          coverage: none

      - name: Install Moodle Plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin && pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin && pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      - name: Queue required InteractEmbed consumers
        run: |
          moodle-plugin-ci add-plugin InteractEmbed/moodle-mod_interactembed
          moodle-plugin-ci add-plugin InteractEmbed/moodle-block_interactembed

      - name: Install Moodle test site
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle }}
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1

      - if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint
      - if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0
      - if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0
      - if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate
      - if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints
      - if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache
      - if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0
      - if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning
